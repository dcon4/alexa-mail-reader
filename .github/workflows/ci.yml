name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build deploy bundle
        run: zip -r mail-reader-bundle.zip skill-package src -x '*.DS_Store'

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: mail-reader-bundle
          path: mail-reader-bundle.zip
          if-no-files-found: error
