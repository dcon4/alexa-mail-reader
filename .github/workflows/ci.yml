name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build deploy bundle
        run: zip -r mail-reader-bundle.zip skill-package src -x '*.DS_Store'

      - name: Upload deploy bundle
        uses: actions/upload-artifact@v4
        with:
          name: mail-reader-bundle
          path: mail-reader-bundle.zip
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Package function code
        run: zip -qr lambda-deploy.zip src node_modules package.json

      - name: Deploy to Lambda
        run: aws lambda update-function-code --function-name email-reader-skill --zip-file fileb://lambda-deploy.zip
